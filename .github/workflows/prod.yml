name: Inner Peace CICD Workflow

on:
  push:
    branches:
      - main

jobs:

  # Stage 1
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v6

      - name: Debug Repo Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type -f name package.json
      
      - name: Install Dependencies
        working-directory: innerpeace
        run: npm install
      
      - name: Run Test
        working-directory: innerpeace
        run: npm test -- --watchAll=false


  # Stage 2
  trivy-scan:
      name: Trivy Security Scan
      runs-on: ubuntu-latest
      needs: build-test

      steps:
        - name: Checkout Code
          uses: actions/checkout@v5

        - name: Run Trivy Scan
          uses: aquasecurity/trivy-action@master
          continue-on-error: true
          with:
            scan-type: 'fs'
            scan-ref: .
            severity: CRITICAL

  # Stage 3
  docker-build-push:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build Docker image
        run: |
          docker build -t kopilnagi/innerpeace:latest ./innerpeace

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: kopilnagi/innerpeace:latest
          formate: table
          exit-code: 1
          severity: CRITICAL
      
      - name: Push Docker image
        run: |
          docker push kopilnagi/innerpeace:latest

    
